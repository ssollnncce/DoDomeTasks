services:

  # ============= Backend (Laravel) =============
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - app_network

  # ============= Web Server (Nginx) =============
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./backend:/var/www/html/
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - app_network

  # ============= Database (MySQL) =============
  database:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - app_network

  # ============= Composer =============
  composer:
    image: composer:latest
    container_name: composer
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    entrypoint: [ 'composer' ]
    networks:
      - app_network

  # ============= Artisan (Laravel CLI) =============
  artisan:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artisan
    entrypoint: ['php', '/var/www/html/artisan']
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
    networks:
      - app_network

  # ============= Frontend (Vue + Vite) =============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    working_dir: /app
    command: ["npm", "run", "dev"]
    networks:
      - app_network

volumes:
  database_data:
networks:
  app_network:
    driver: bridge
